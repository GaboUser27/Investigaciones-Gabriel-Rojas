<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principio 7 - Flexibilidad</title>
</head>
<body>
    <h1>Formulario de búsqueda</h1>

    <!-- Campo de texto para que el usuario escriba -->
    <input type="text" id="busqueda" placeholder="Escribe algo...">

    <!-- Botón tradicional (para usuarios principiantes) -->
    <button id="btnBuscar">Buscar</button>

    <!-- Aquí mostraremos el resultado -->
    <p id="resultado"></p>

    <!-- Aquí cargaremos la imagen dinámica -->
    <img id="imagenResultado" src="" alt="" style="max-width:200px; display:none;">

    <!-- Vinculamos el archivo JS -->
    <script src="script.js"></script>
</body>
</html>
